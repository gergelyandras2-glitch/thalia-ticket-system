<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: html-head(${performance.title})}"></head>
<body>

<header th:replace="~{fragments :: navbar}"></header>

<main class="container" style="max-width: 900px;">

    <a th:href="@{/performances}" class="btn btn-outline" style="margin-bottom: 1.5rem;">&larr; Vissza a műsorokhoz</a>

    <div class="card" style="overflow: hidden;">
        <div style="height: 350px; background: #1e293b; overflow: hidden; position: relative;">
            <img th:src="${performance.imageUrl != null and !performance.imageUrl.isEmpty() ? performance.imageUrl : 'https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=1200&q=80'}"
                 th:alt="${performance.title}" style="width: 100%; height: 100%; object-fit: cover;">
            <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(15,23,42,0.9)); padding: 2rem 2rem 1.5rem;">
                <span class="card-badge" th:text="${performance.genre}" style="position: static; display: inline-block; margin-bottom: 0.5rem;">Műfaj</span>
                <h1 style="color: #fef08a; font-family: var(--font-serif); font-size: 2.4rem;" th:text="${performance.title}">Előadás Címe</h1>
                <p style="color: #cbd5e1; font-size: 1.1rem;" th:text="${performance.author}">Szerző</p>
            </div>
        </div>

        <div class="card-body" style="padding: 2.5rem;">
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                <div>
                    <h3 style="margin-bottom: 1rem; color: #0f172a;">A színdarabról</h3>
                    <p style="font-size: 1.05rem; line-height: 1.8; color: #334155;" th:text="${performance.description}">Részletes ismertető...</p>
                </div>
                <div style="background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); height: fit-content;">
                    <h4 style="margin-bottom: 1rem; color: #0f172a; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">Előadás Információk</h4>
                    <p style="margin-bottom: 0.75rem;"><strong>📅 Időpont:</strong><br><span th:text="${performance.getFormattedDate()}"></span></p>
                    <p style="margin-bottom: 0.75rem;"><strong>🏛️ Terem:</strong><br><span th:text="${performance.hall.name}"></span></p>
                    <p style="margin-bottom: 0.75rem;"><strong>⏱️ Időtartam:</strong><br><span th:text="${performance.durationMinutes} + ' perc'"></span></p>
                    <p style="margin-bottom: 0.75rem;"><strong>🎟️ Szabad székek:</strong><br><span th:text="${performance.getAvailableSeatsCount()} + ' db'"></span></p>
                    <p style="margin-bottom: 1.5rem;"><strong>💰 Kezdő jegyár:</strong><br><span style="font-size: 1.3rem; font-weight: 700; color: #831843;" th:text="${#numbers.formatDecimal(performance.basePrice, 0, 'POINT', 0, 'COMMA')} + ' Ft'"></span></p>

                    <a th:href="@{/bookings/select-seats/{id}(id=${performance.id})}" class="btn btn-gold" style="width: 100%; font-size: 1.05rem; padding: 0.85rem;">
                        Helyfoglalás és Jegyvásárlás
                    </a>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
